[pytest]
testpaths = tests
addopts = -ra --strict-markers
markers =
    unit: fast tests of a single module
    integration: several components together (database, pipeline, audit chain)
    api: REST API tests through the HTTP interface
    security: attack / abuse scenarios (tampering, malformed input, access control, injection)
filterwarnings =
    # third-party deprecations outside this project's control
    ignore::DeprecationWarning:starlette.*
    ignore::DeprecationWarning:fastapi.*
    ignore::DeprecationWarning:pytest_asyncio.*
    ignore:Using `httpx` with `starlette.testclient`
