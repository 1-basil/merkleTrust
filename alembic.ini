# Alembic configuration. The database URL comes from MerkleTrust settings
# (MERKLETRUST_DATABASE_URL / MERKLETRUST_DATA_DIR), see migrations/env.py.
#   alembic upgrade head                      apply migrations
#   alembic revision --autogenerate -m "..."  create a migration after model changes
[alembic]
script_location = migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
