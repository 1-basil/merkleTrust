<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Secure Portal Login</title>

</head>
<body>
  <h2>Customer Sign In</h2>

    <label>Password: <input type="password" name="pass"></label><br>
    <button type="submit">Log In</button>
  </form>
</body>
</html>
